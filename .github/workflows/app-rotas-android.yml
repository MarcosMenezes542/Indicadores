# Gera o APK do app Rota de Entregas automaticamente a cada alteração em app-rotas/.
# O APK fica disponível na aba "Actions" do GitHub, em "Artifacts".
name: App Rota de Entregas (Android)

on:
  push:
    paths:
      - 'app-rotas/**'
      - '.github/workflows/app-rotas-android.yml'
  workflow_dispatch:

# Permite publicar o APK na página de downloads (Releases) do repositório.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-rotas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-rotas/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app para o projeto Android
        run: npx cap sync android

      - name: Preparar assinatura de venda (se configurada)
        id: assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ROTA_KEYSTORE_BASE64 || secrets.PALCO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rota.jks"
            echo "ROTA_KEYSTORE=$RUNNER_TEMP/rota.jks" >> "$GITHUB_ENV"
            echo "tipo=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem chave de assinatura configurada: gerando APK de TESTE (debug)."
            echo "tipo=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar APK
        working-directory: app-rotas/android
        env:
          ROTA_KEYSTORE_SENHA: ${{ secrets.ROTA_KEYSTORE_SENHA || secrets.PALCO_KEYSTORE_SENHA }}
          ROTA_KEY_ALIAS: ${{ secrets.ROTA_KEY_ALIAS || secrets.PALCO_KEY_ALIAS }}
          ROTA_KEY_SENHA: ${{ secrets.ROTA_KEY_SENHA || secrets.PALCO_KEY_SENHA }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.assinatura.outputs.tipo }}" = "release" ]; then
            # APK (link de download) e AAB (pacote para a Play Store)
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rota-de-entregas-${{ steps.assinatura.outputs.tipo }}
          path: app-rotas/android/app/build/outputs/apk/**/*.apk

      - name: Guardar pacote da Play Store (.aab)
        if: steps.assinatura.outputs.tipo == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: rota-de-entregas-play-store-aab
          path: app-rotas/android/app/build/outputs/bundle/release/*.aab

      # Link fixo e público para baixar direto no celular:
      # https://github.com/<dono>/<repositório>/releases/download/rota-de-entregas/Rota-de-Entregas.apk
      - name: Publicar APK para download
        working-directory: app-rotas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" Rota-de-Entregas.apk
          if gh release view rota-de-entregas >/dev/null 2>&1; then
            gh release upload rota-de-entregas Rota-de-Entregas.apk --clobber
          else
            gh release create rota-de-entregas Rota-de-Entregas.apk --target "$GITHUB_SHA" \
              --title "Rota de Entregas (Android)" \
              --notes "Baixe o arquivo Rota-de-Entregas.apk no celular e toque nele para instalar. Este arquivo é atualizado a cada nova versão."
          fi
