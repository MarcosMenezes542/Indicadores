# Gera o APK do app Palco automaticamente a cada alteração em app-cifras/.
# O APK fica disponível na aba "Actions" do GitHub, em "Artifacts".
name: App Palco (Android)

on:
  push:
    paths:
      - 'app-cifras/**'
      - '.github/workflows/app-cifras-android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-cifras
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-cifras/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app para o projeto Android
        run: npx cap sync android

      - name: Preparar assinatura de venda (se configurada)
        id: assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.PALCO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/palco.jks"
            echo "PALCO_KEYSTORE=$RUNNER_TEMP/palco.jks" >> "$GITHUB_ENV"
            echo "tipo=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem chave de assinatura configurada: gerando APK de TESTE (debug)."
            echo "tipo=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar APK
        working-directory: app-cifras/android
        env:
          PALCO_KEYSTORE_SENHA: ${{ secrets.PALCO_KEYSTORE_SENHA }}
          PALCO_KEY_ALIAS: ${{ secrets.PALCO_KEY_ALIAS }}
          PALCO_KEY_SENHA: ${{ secrets.PALCO_KEY_SENHA }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.assinatura.outputs.tipo }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: palco-${{ steps.assinatura.outputs.tipo }}
          path: app-cifras/android/app/build/outputs/apk/**/*.apk
