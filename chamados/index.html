<body>
<div class="box" id="abertura">
  <img src="/icone-192.png" alt="CPFL Energia">
  <h1>Segurança Empresarial</h1>
  <p>Sistema de chamados de fornecedores</p>
  <div class="gira" id="gira"></div>
  <div class="erro" id="erro">Não foi possível abrir o sistema. Verifique a internet e tente de novo.<br><button type="button" onclick="abrir()">Tentar de novo</button></div>

<template id="ajustes">
<style id="ajuste-rodape-celular">
/* Tela de login: frase sobre a abertura de chamados de manutenção */
.login-frase{display:flex;gap:10px;align-items:flex-start;margin:-6px 0 20px;padding:11px 13px;border-radius:10px;background:#eef5fb;border-left:4px solid var(--accent,#f68b1f);color:#1f3b57;font-size:13px;line-height:1.45}
.login-frase svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--brand,#0058a0)}
/* Tela de login: lembrar o login (usuário) neste aparelho */
.lembrar-login{display:flex;align-items:center;gap:8px;margin:-2px 0 14px;font-size:13px;color:var(--ink-2,#4b5563);cursor:pointer;user-select:none}
.lembrar-login input{width:18px;height:18px;margin:0;accent-color:var(--brand,#0058a0);cursor:pointer}
/* Celular/tablet: barra lateral estreita. Toque no círculo com as iniciais para ver nome, perfil e informações. */
@media (max-width:980px){
.side-foot{padding:12px 6px 14px}
.side-foot .eu{justify-content:center;cursor:pointer}
.side-foot .eu .av{width:38px;height:38px;font-size:14px;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.side-foot .side-2 button{padding:9px 0;min-height:38px}
.side-foot svg{width:18px;height:18px;flex:none}
.side-foot.aberto{position:fixed;left:8px;bottom:8px;width:min(270px,calc(100vw - 16px));z-index:350;background:var(--sidebar,#0058a0);border-radius:14px;padding:16px;box-shadow:0 14px 34px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15)}
.sidebar.rodape-aberto{z-index:360}
.side-foot.aberto .txt{display:block}
.side-foot.aberto button span{display:inline}
.side-foot.aberto .eu{justify-content:flex-start}
.side-foot.aberto .eu b{max-width:180px}
.side-foot.aberto .side-2{flex-direction:column}
.side-foot.aberto .side-2 button{padding:9px 12px;justify-content:flex-start;font-size:13px}
}
</style>
<script>
(function () {
  var pe = document.querySelector('.side-foot'); if (!pe) return;
  var eu = pe.querySelector('.eu'); if (!eu) return;
  var lado = pe.closest('.sidebar');
  var marcar = function () { if (lado) lado.classList.toggle('rodape-aberto', pe.classList.contains('aberto')); };
  var estreito = function () { return matchMedia('(max-width:980px)').matches; };
  eu.title = 'Toque para ver seu usuário e as informações';
  eu.addEventListener('click', function (e) { if (!estreito()) return; e.stopPropagation(); pe.classList.toggle('aberto'); marcar(); });
  document.addEventListener('click', function (e) { if (pe.classList.contains('aberto') && !pe.contains(e.target)) { pe.classList.remove('aberto'); marcar(); } });
  pe.querySelectorAll('.side-2 button').forEach(function (b) { b.addEventListener('click', function () { pe.classList.remove('aberto'); marcar(); }); });
  addEventListener('resize', function () { if (!estreito()) { pe.classList.remove('aberto'); marcar(); } });
})();
</script>
<script>
(function () {
  var marca = document.querySelector('.login-card .login-brand'); if (!marca || document.querySelector('.login-frase')) return;
  var d = document.createElement('div'); d.className = 'login-frase';
  d.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>' +
    '<span>Registre e acompanhe aqui os <b>chamados de manutenção das unidades CPFL</b>: agilidade no atendimento e segurança em cada instalação.</span>';
  marca.insertAdjacentElement('afterend', d);
})();
</script>
<script>
(function () {
  var CH = 'chamados_login_salvo';
  var form = document.getElementById('lgEntrar'), lg = document.getElementById('lgLogin'), sn = document.getElementById('lgSenha');
  if (!form || !lg || document.getElementById('lgLembrar')) return;
  var ler = function () { try { return localStorage.getItem(CH) || ''; } catch (e) { return ''; } };
  var gravar = function (v) { try { v ? localStorage.setItem(CH, v) : localStorage.removeItem(CH); } catch (e) {} };
  var rot = document.createElement('label'); rot.className = 'lembrar-login';
  rot.innerHTML = '<input type="checkbox" id="lgLembrar"> Lembrar meu usuário neste aparelho';
  var campoSenha = sn ? sn.closest('.campo') : null;
  (campoSenha || lg.closest('.campo')).insertAdjacentElement('afterend', rot);
  var cx = document.getElementById('lgLembrar');
  var preencher = function () {
    var v = ler(); cx.checked = !!v;
    if (v && !lg.value) lg.value = v;
  };
  preencher();
  // quando a tela de login aparece, o sistema coloca o cursor no Login; se já estiver salvo, vai direto para a Senha
  new MutationObserver(function () {
    if (form.style.display === 'none') return;
    preencher();
    if (lg.value && sn) setTimeout(function () { if (document.activeElement === lg || document.activeElement === document.body) sn.focus(); }, 120);
  }).observe(form, { attributes: true, attributeFilter: ['style'] });
  form.addEventListener('submit', function () { gravar(cx.checked ? lg.value.trim() : ''); }, true);
  cx.addEventListener('change', function () { if (!cx.checked) gravar(''); });
})();
</script>
<script>
(function () { // nome do aplicativo na tela inicial do celular
  var NOME = 'Chamados de Manutenções';
  var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (!m) { m = document.createElement('meta'); m.name = 'apple-mobile-web-app-title'; document.head.appendChild(m); }
  m.content = NOME;
  var a = document.querySelector('meta[name="application-name"]');
  if (!a) { a = document.createElement('meta'); a.name = 'application-name'; document.head.appendChild(a); }
  a.content = NOME;
})();
</script>

<script>
(function () { // botão para alternar o tema claro/escuro (mesmo comportamento do painel de Sites)
  var CH = 'chamados_tema', raiz = document.documentElement;
  var LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>';
  var SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var salvo = function () { try { return localStorage.getItem(CH) || ''; } catch (e) { return ''; } };
  var sistema = function () { return matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'; };
  var botoes = [];
  var aplicar = function (t) {
    raiz.dataset.tema = t;
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === 'escuro' ? '#040F26' : '#061B40';
    botoes.forEach(function (b) {
      var p = t === 'escuro' ? 'claro' : 'escuro';
      b.title = 'Mudar para o tema ' + p; b.setAttribute('aria-label', 'Alternar tema claro/escuro (atual: ' + t + ')');
      b.innerHTML = (t === 'escuro' ? SOL : LUA) + (b.dataset.rot ? '<span>' + (t === 'escuro' ? 'Tema claro' : 'Tema escuro') + '</span>' : '');
    });
  };
  var alternar = function () {
    var nx = raiz.dataset.tema === 'escuro' ? 'claro' : 'escuro';
    try { localStorage.setItem(CH, nx); } catch (e) {}
    aplicar(nx);
  };
  var criar = function (cls, rot) {
    var b = document.createElement('button'); b.type = 'button'; b.className = cls; if (rot) b.dataset.rot = '1';
    b.addEventListener('click', alternar); botoes.push(b); return b;
  };
  var dir = document.querySelector('.topbar .dir');
  if (dir && !document.getElementById('btnTema')) { var b = criar('btn btn-tema', false); b.id = 'btnTema'; dir.appendChild(b); }
  var lg = document.getElementById('login');
  if (lg && !document.getElementById('btnTemaLogin')) { var l = criar('btn-tema-login', true); l.id = 'btnTemaLogin'; lg.appendChild(l); }
  aplicar(salvo() || raiz.dataset.tema || sistema());
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (!salvo()) aplicar(sistema()); });
})();
</script>
</template>
<script>
// Página de abertura: busca a tela do sistema na nuvem e monta. Não depende do notebook.
addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; });
function abrir() {
  document.getElementById('erro').style.display = 'none';
  document.getElementById('gira').style.display = '';
  fetch('/site/index.html', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      var extra = document.getElementById('ajustes').innerHTML;
      var fim = html.lastIndexOf('</body>');
      html = fim >= 0 ? html.slice(0, fim) + extra + html.slice(fim) : html + extra;
      // tema escolhido (claro/escuro) já aplicado na abertura, para não piscar
      var tema = ''; try { tema = localStorage.getItem('chamados_tema') || ''; } catch (e) {}
      if (!tema) tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
      html = html.replace(/<html(\s|>)/i, '<html data-tema="' + tema + '"$1');
      document.open(); document.write(html); document.close();
    })
    .catch(function () {
      document.getElementById('gira').style.display = 'none';
      document.getElementById('erro').style.display = 'block';
    });
}
abrir();
</script>
</body>
</html>
